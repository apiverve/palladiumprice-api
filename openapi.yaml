openapi: 3.0.4
info:
  title: Palladium Price
  description: >-
    Palladium Price tracks real-time spot rates for palladium per ounce, gram,
    and kilogram in USD. It supplies 24-hour price changes and update
    timestamps, while paid plans add custom currencies, 7- and 30-day changes,
    30-day stats, and hourly and 30-day daily history.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/palladiumprice:
    get:
      summary: Palladium Price
      description: >-
        Get the current price of palladium. You can optionally specify a
        currency (defaults to USD).
      operationId: palladiumprice
      parameters:
        - name: currency
          in: query
          schema:
            type: string
          required: false
          description: The currency to get the price in
          example: USD
        - name: hourly
          in: query
          schema:
            type: boolean
          required: false
          description: Include hourly price data for the past 24 hours
          example: true
        - name: daily
          in: query
          schema:
            type: boolean
          required: false
          description: Include the daily closing price per ounce for the last 30 days
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
